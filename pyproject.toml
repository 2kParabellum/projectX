[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbx"
version = "0.1.0"
description = "Sports arbitrage monitor across Polymarket and bookmakers"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "urllib3>=2.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.2", "ruff>=0.5", "jupyterlab>=4.2"]

[project.scripts]
arbx = "arbx.cli:app"

[tool.setuptools.packages.find]
include = ["arbx*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
